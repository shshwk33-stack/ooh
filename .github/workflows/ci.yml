name: Research pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Install locked environment
        run: bash scripts/setup.sh
      - name: Offline synthetic end-to-end smoke
        run: bash scripts/run.sh transit-ooh research --quick
      - name: Unit, regression, scientific checks and Streamlit interactions
        run: bash scripts/run.sh pytest --junitxml=reports/runs/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evidence
          path: reports/
