[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "transit-ooh"
version = "0.1.0"
description = "Reproducible mobility and spatial decision analysis; no advertising-effect claims"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<2.4", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "pyproj>=3.7,<4", "shapely>=2.1,<3", "matplotlib>=3.10,<4",
  "pyarrow>=19,<24", "PyYAML>=6,<7", "requests>=2.32,<3",
  "streamlit>=1.45,<2", "pydeck>=0.9,<1", "openpyxl>=3.1,<4",
]

[project.scripts]
transit-ooh = "transit_ooh.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8", "folium>=0.19,<1", "geopandas>=1,<2", "pymupdf>=1.25,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_ooh"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
allowed-confusables = ["α", "×", "–", "−"]

[tool.ruff.lint.per-file-ignores]
# Matplotlib environment/backend must be configured before pyplot import.
"src/transit_ooh/figures.py" = ["E402"]
"src/transit_ooh/viewt_report.py" = ["E402"]
"scripts/revision_summary.py" = ["E402"]
